<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chapter 3: Main Memory (RAM & ROM) - Learning Check</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --correct: #22c55e;
            --incorrect: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 768px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            border-bottom: 2px solid var(--border);
            padding-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.35rem;
            color: var(--text);
        }

        .score-board {
            font-weight: 600;
            color: var(--primary);
            background: #e0e7ff;
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background-color: var(--border);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background-color: var(--primary);
            transition: width 0.3s ease;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card-header {
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary);
        }

        .prompt {
            font-size: 1.1rem;
            font-weight: 500;
            line-height: 1.5;
        }

        /* Multiple Choice Styles */
        .options {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .option-btn {
            background: #fff;
            border: 1px solid var(--border);
            padding: 0.75rem 1rem;
            border-radius: 6px;
            text-align: left;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background-color: #f5f3ff;
        }

        .option-btn.correct {
            background-color: #dcfce7;
            border-color: var(--correct);
            color: #14532d;
        }

        .option-btn.incorrect {
            background-color: #fee2e2;
            border-color: var(--incorrect);
            color: #7f1d1d;
        }

        /* Matching Styles */
        .matching-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .match-list {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .match-item {
            padding: 0.75rem;
            border: 1px dashed var(--border);
            border-radius: 6px;
            background: #fafafa;
            cursor: pointer;
            text-align: center;
            user-select: none;
            font-size: 0.95rem;
        }

        .match-item.selected {
            border-color: var(--primary);
            background: #e0e7ff;
        }

        .match-item.matched {
            border-color: var(--correct);
            background: #dcfce7;
            cursor: default;
        }

        /* Input / Calculation Styles */
        .input-group {
            display: flex;
            gap: 0.5rem;
        }

        input[type="text"] {
            flex: 1;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
        }

        button.action-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        button.action-btn:hover {
            background-color: var(--primary-hover);
        }

        .feedback {
            margin-top: 1rem;
            padding: 0.75rem;
            border-radius: 6px;
            display: none;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background-color: #dcfce7;
            color: #14532d;
        }

        .feedback.incorrect {
            background-color: #fee2e2;
            color: #7f1d1d;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Main Memory: RAM and ROM</h1>
        <div class="score-board">Score: <span id="score">0</span></div>
    </header>

    <div class="progress-bar">
        <div class="progress-fill" id="progress"></div>
    </div>

    <!-- Container where active task rendering occurs -->
    <main id="activity-container"></main>

    <div class="controls">
        <button id="prev-btn" class="action-btn" style="background-color: var(--text-muted);" disabled>Previous</button>
        <button id="next-btn" class="action-btn">Next</button>
    </div>
</div>

<script>
    /**
     * EXERCISE CONTENT INJECTED FROM CHAPTER 3 PPT
     */
    const tasksData = [
        {
            id: 1,
            type: "multiple-choice",
            category: "Memory Characteristics",
            prompt: "What happens to the data stored in RAM when the computer power is turned off?",
            options: [
                "It is saved permanently to the hard drive.",
                "It disappears instantly because RAM is volatile memory.",
                "It is stored safely inside BIOS.",
                "It gets converted into flash memory."
            ],
            correctIndex: 1,
            explanation: "RAM is volatile memory, meaning all data stored in it disappears instantly when the computer is turned off[span_12](start_span)[span_12](end_span)."
        },
        {
            id: 2,
            type: "matching",
            category: "Term & Definition Matching",
            prompt: "Click an item on the left, then click its corresponding description on the right:",
            pairs: [
                { left: "Bootstrap", right: "Loads & runs the Operating System" },
                { left: "BIOS", right: "Manages I/O data transfer during startup" },
                { left: "Cache Memory", right: "Fastest memory storing CPU's recent data" },
                { left: "Flash Memory", right: "Non-volatile memory used in SSDs and USB drives" }
            ],
            explanation: "ROM stores the bootstrap and BIOS[span_13](start_span)[span_13](end_span)[span_14](start_span)[span_14](end_span). Cache is the fastest memory inside CPU[span_15](start_span)[span_15](end_span)[span_16](start_span)[span_16](end_span). Flash memory is used for SSDs and USB drives[span_17](start_span)[span_17](end_span)[span_18](start_span)[span_18](end_span)."
        },
        {
            id: 3,
            type: "fill-in-blank",
            category: "Memory Unit Calculation",
            prompt: "How many Megabytes (MB) are equal to 8 Gigabytes (GB) of RAM? (Hint: 1 GB = 1024 MB)",
            acceptableAnswers: ["8192", "8192MB", "8192 MB"],
            explanation: "Since 1 GB = 1024 MB, 8 GB = 8 × 1024 = 8192 MB[span_19](start_span)[span_19](end_span)[span_20](start_span)[span_20](end_span)."
        },
        {
            id: 4,
            type: "multiple-choice",
            category: "CPU Operations & Memory",
            prompt: "When the CPU needs to retrieve data, which memory does it check FIRST?",
            options: [
                "RAM",
                "USB Flash Drive",
                "Cache Memory",
                "Hard Disk Drive"
            ],
            correctIndex: 2,
            explanation: "The CPU first searches cache memory for requested data[span_21](start_span)[span_21](end_span). If found, it retrieves it quickly without having to access RAM[span_22](start_span)[span_22](end_span)."
        },
        {
            id: 5,
            type: "matching",
            category: "Storage Application",
            prompt: "Match each file type with its typical storage size:",
            pairs: [
                { left: "1 Page of Text File", right: "~3 KB" },
                { left: "1 AAC Music File", right: "~5 MB" },
                { left: "1 Hour of 4K MP4 Video", right: "~20 GB" }
            ],
            explanation: "Text files take very few KB[span_23](start_span)[span_23](end_span), music files take several MB[span_24](start_span)[span_24](end_span), and high-resolution 4K video occupies gigabytes[span_25](start_span)[span_25](end_span)."
        },
        {
            id: 6,
            type: "multiple-choice",
            category: "Data Security",
            prompt: "Which of the following is a recommended method to protect sensitive data stored on a USB flash drive?",
            options: [
                "Reformatting the RAM frequently",
                "Encrypting sensitive data using software or built-in features",
                "Increasing the CPU word length to 64-bit",
                "Deleting BIOS settings regularly"
            ],
            correctIndex: 1,
            explanation: "Encrypting sensitive data and setting strong passwords are effective ways to protect portable USB flash drives from data leaks[span_26](start_span)[span_26](end_span)."
        }
    ];

    // State Management
    let currentIndex = 0;
    let score = 0;
    const completedTasks = new Set();

    // DOM Elements
    const activityContainer = document.getElementById("activity-container");
    const scoreEl = document.getElementById("score");
    const progressEl = document.getElementById("progress");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");

    function init() {
        renderTask();
        updateControls();
    }

    function updateProgress() {
        const percentage = ((currentIndex + 1) / tasksData.length) * 100;
        progressEl.style.width = `${percentage}%`;
    }

    function updateControls() {
        prevBtn.disabled = currentIndex === 0;
        if (currentIndex === tasksData.length - 1) {
            nextBtn.textContent = "Finish";
        } else {
            nextBtn.textContent = "Next";
        }
    }

    function renderTask() {
        updateProgress();
        const task = tasksData[currentIndex];
        activityContainer.innerHTML = "";

        const card = document.createElement("div");
        card.className = "card";

        const category = document.createElement("div");
        category.className = "card-header";
        category.textContent = task.category;
        card.appendChild(category);

        const prompt = document.createElement("div");
        prompt.className = "prompt";
        prompt.textContent = task.prompt;
        card.appendChild(prompt);

        if (task.type === "multiple-choice") {
            renderMultipleChoice(card, task);
        } else if (task.type === "matching") {
            renderMatching(card, task);
        } else if (task.type === "fill-in-blank") {
            renderFillInBlank(card, task);
        }

        activityContainer.appendChild(card);
    }

    /* --- TASK RENDERERS --- */

    function renderMultipleChoice(card, task) {
        const optionsContainer = document.createElement("div");
        optionsContainer.className = "options";

        const feedback = document.createElement("div");
        feedback.className = "feedback";

        task.options.forEach((optText, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.textContent = optText;
            btn.onclick = () => {
                if (completedTasks.has(task.id)) return;
                
                if (idx === task.correctIndex) {
                    btn.classList.add("correct");
                    feedback.textContent = `Correct! ${task.explanation}`;
                    feedback.className = "feedback show correct";
                    addScore();
                } else {
                    btn.classList.add("incorrect");
                    feedback.textContent = `Incorrect. ${task.explanation}`;
                    feedback.className = "feedback show incorrect";
                }
                completedTasks.add(task.id);
            };
            optionsContainer.appendChild(btn);
        });

        card.appendChild(optionsContainer);
        card.appendChild(feedback);
    }

    function renderMatching(card, task) {
        const grid = document.createElement("div");
        grid.className = "matching-grid";

        const leftCol = document.createElement("div");
        leftCol.className = "match-list";
        const rightCol = document.createElement("div");
        rightCol.className = "match-list";

        const feedback = document.createElement("div");
        feedback.className = "feedback";

        const shuffledRight = [...task.pairs].sort(() => Math.random() - 0.5);

        let selectedLeft = null;
        let matchesFound = 0;

        task.pairs.forEach((pair) => {
            const leftEl = document.createElement("div");
            leftEl.className = "match-item";
            leftEl.textContent = pair.left;
            leftEl.dataset.key = pair.left;

            leftEl.onclick = () => {
                if (leftEl.classList.contains("matched")) return;
                document.querySelectorAll(".match-list:first-child .match-item").forEach(el => el.classList.remove("selected"));
                leftEl.classList.add("selected");
                selectedLeft = pair;
            };

            leftCol.appendChild(leftEl);
        });

        shuffledRight.forEach((pair) => {
            const rightEl = document.createElement("div");
            rightEl.className = "match-item";
            rightEl.textContent = pair.right;

            rightEl.onclick = () => {
                if (!selectedLeft || rightEl.classList.contains("matched")) return;

                if (selectedLeft.right === pair.right) {
                    rightEl.classList.add("matched");
                    const leftEl = Array.from(leftCol.children).find(el => el.dataset.key === selectedLeft.left);
                    if (leftEl) leftEl.classList.add("matched", "selected");
                    
                    matchesFound++;
                    selectedLeft = null;

                    if (matchesFound === task.pairs.length) {
                        feedback.textContent = `All matched correctly! ${task.explanation}`;
                        feedback.className = "feedback show correct";
                        if (!completedTasks.has(task.id)) {
                            addScore();
                            completedTasks.add(task.id);
                        }
                    }
                } else {
                    feedback.textContent = "Incorrect pair match. Try selecting another item.";
                    feedback.className = "feedback show incorrect";
                }
            };

            rightCol.appendChild(rightEl);
        });

        grid.appendChild(leftCol);
        grid.appendChild(rightCol);
        card.appendChild(grid);
        card.appendChild(feedback);
    }

    function renderFillInBlank(card, task) {
        const inputGroup = document.createElement("div");
        inputGroup.className = "input-group";

        const input = document.createElement("input");
        input.type = "text";
        input.placeholder = "Enter calculated value...";

        const submitBtn = document.createElement("button");
        submitBtn.className = "action-btn";
        submitBtn.textContent = "Submit";

        const feedback = document.createElement("div");
        feedback.className = "feedback";

        submitBtn.onclick = () => {
            if (completedTasks.has(task.id)) return;
            const val = input.value.trim().toLowerCase();
            const isCorrect = task.acceptableAnswers.some(ans => ans.toLowerCase() === val);

            if (isCorrect) {
                feedback.textContent = `Correct! ${task.explanation}`;
                feedback.className = "feedback show correct";
                addScore();
            } else {
                feedback.textContent = `Incorrect. ${task.explanation}`;
                feedback.className = "feedback show incorrect";
            }
            completedTasks.add(task.id);
        };

        inputGroup.appendChild(input);
        inputGroup.appendChild(submitBtn);
        card.appendChild(inputGroup);
        card.appendChild(feedback);
    }

    function addScore() {
        score += 10;
        scoreEl.textContent = score;
    }

    /* --- NAVIGATION --- */
    prevBtn.addEventListener("click", () => {
        if (currentIndex > 0) {
            currentIndex--;
            renderTask();
            updateControls();
        }
    });

    nextBtn.addEventListener("click", () => {
        if (currentIndex < tasksData.length - 1) {
            currentIndex++;
            renderTask();
            updateControls();
        } else {
            alert(`Exercise Complete! Final Score: ${score}`);
        }
    });

    init();
</script>
</body>
</html>
